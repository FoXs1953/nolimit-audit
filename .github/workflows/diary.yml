name: ArtTech diary
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: chromium
            runner: ubuntu-latest
          - engine: webkit
            runner: macos-15
    env:
      ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Verify offline asset list
        run: |
          python3 tools/update_offline.py
          git diff --exit-code -- dist/offline-list.js
      - name: Verify friendships, publication access and discussion
        run: |
          npm run build
          npm run test:publications
          npm run test:friends
      - name: Verify journal in the browser
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 --directory dist >/tmp/nolimit-http.log 2>&1 &
          for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:8000/ -o /dev/null && break || sleep 1; done
          node tools/check_diary.cjs http://127.0.0.1:8000/
          node tools/check_diary_art.cjs http://127.0.0.1:8000/
          node tools/check_music_links.cjs http://127.0.0.1:8000/
          node tools/check_diary_inputs.cjs http://127.0.0.1:8000/
          node tools/check_diary_languages.cjs http://127.0.0.1:8000/
          node tools/check_diary_storage.cjs http://127.0.0.1:8000/
          node tools/check_diary_offline.cjs http://127.0.0.1:8000/
