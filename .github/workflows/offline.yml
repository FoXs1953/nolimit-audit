name: Offline audit environment
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the pinned Python image
        run: docker build -t nolimit-audit .
      - name: Verify without a network
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m --cpus=2 --memory=4g --pids-limit=96 --cap-drop=ALL nolimit-audit
      - name: Run a policy in a separate container
        run: python3 tools/isolated_run.py --image nolimit-audit --policy reconcile --seed 908411
